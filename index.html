<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>旅行手帳</title>
<!-- Hand-written index; the travel plugin only renders the per-trip folders. Add a <li> per new trip. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root {
  --paper: #fbfcfd;
  --grid: #e3eaf0;
  --ink: #1f2b4d;
  --pencil: #6b7590;
  --rule: #c9d3dd;
  --swipe: rgba(255, 210, 0, .5);
  --hand: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", "BiauKai", serif;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink);
  font: 16px/1.65 var(--sans);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
}
.wrap {
  max-width: 640px; margin: 0 auto;
  padding: 32px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px));
}
h1 { margin: 0 0 24px; font: 700 clamp(30px, 8vw, 44px)/1.2 var(--hand); }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; border-top: 1px solid var(--rule); }
li { border-bottom: 1px solid var(--rule); padding-block: 12px; }
a { display: grid; gap: 2px; color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 3px; }
.name { font: 700 24px/1.3 var(--hand); }
a:hover .name { background: var(--swipe); border-radius: 2px 6px 3px 5px; }
.when { color: var(--pencil); font-size: 15px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <h1>旅行手帳</h1>
  <ul>
    <li>
      <a href="2026-11-okinawa/">
        <span class="name">沖繩六天五夜</span>
        <span class="when">2026/11/24 – 11/29</span>
      </a>
    </li>
  </ul>
</div>
</body>
</html>
