/* Light only, by choice: it is read outdoors in daylight.

:root {
  --paper: #fbfcfd;

* { box-sizing: border-box; }

body {

.wrap {

  const who = (lid.pokemon || []).join("、");
  return el("div", { class: "lid" },
    (it.kind === "lid" ? "特地繞過來抓 Pokémon GO 人孔蓋" : "這站旁邊有 Pokémon GO 人孔蓋") + (who ? "：" + who : ""),
    " ", el("a", { href: "pokefuta/#" + lid.id }, "在人孔蓋地圖上看"));
}
const MODE = { transit: "transit", walk: "walking", walking: "walking", drive: "driving", driving: "driving" };
const MODE_LABEL = { transit: "搭車", walk: "走路", walking: "走路", drive: "開車", driving: "開車" };

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k === "style") n.style.cssText = v; else n.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) n.append(k.nodeType ? k : String(k));
  return n;
}
function parse(d) { const [y, m, dd] = d.split("-").map(Number); return new Date(y, m - 1, dd); }
function md(d) { const x = parse(d); return `${x.getMonth() + 1}/${x.getDate()}`; }
function wd(d) { return WEEK[parse(d).getDay()]; }
function maps(q) { return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q); }
function route(a, b, mode) {
  return "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(a) +
    "&destination=" + encodeURIComponent(b) + "&travelmode=" + (MODE[mode] || "transit");
}
function hl(i) { return `--hl:var(--hl${i % 4})`; }
function factList(facts) {
  if (!facts || !facts.length) return null;
  return el("ul", { class: "facts" }, facts.map(f => el("li", null,
    f.status === "verified" ? el("span", { class: "checked" }, "查過") : el("span", { class: "unchecked" }, "還沒查"),
    el("span", null, f.text, f.source ? [" ", el("a", { href: f.source, target: "_blank", rel: "noopener" }, "出處")] : null))));
}

function bookLink(x) {
  return x.booking_url ? [" ", el("a", { href: x.booking_url, target: "_blank", rel: "noopener" }, x.fixed ? "訂位頁" : "去訂")] : null;
}
function subEntry(a) {
  return el("div", { class: "entry sub" },
    el("h4", { class: "name" }, a.name, " ", el("span", { class: "alt-kind" }, KIND[a.kind] || "")),
    a.get ? el("div", { class: "get" }, (a.kind === "shop" || a.kind === "place" ? "必買：" : "必吃：") + a.get) : null,
    a.note ? el("div", { class: "note" }, a.note) : null,
    factList(a.facts),
    a.booking ? el("div", { class: "book" }, "要先訂：" + a.booking, bookLink(a)) : null,
    a.query ? el("a", { class: "go", href: maps(a.query), target: "_blank", rel: "noopener" }, "在地圖上看") : null);
}
function extras(it, day) {
  const alts = (day.alternates || []).filter(a => a.swap_for === it.name);
  const treats = (day.treats || []).filter(a => a.at === it.name);
  const adds = (day.extras || []).filter(a => a.at === it.name);
  const wander = it.kind === "wander";
  return [
    adds.length ? el("details", { class: "more", open: wander ? "" : null }, el("summary", null, `${wander ? "這段可以逛" : "順路可加"}（${adds.length}）`), adds.map(subEntry)) : null,
    alts.length ? el("details", { class: "more" }, el("summary", null, `可以換成（${alts.length}）`), alts.map(subEntry)) : null,
    treats.length ? el("details", { class: "more" }, el("summary", null, `順路吃點、買點（${treats.length}）`), treats.map(subEntry)) : null];
}

function entry(it, prev, slot, day) {
  const prevQuery = prev && prev.query;
  const t = it.transit;
  return el("div", { class: "entry", style: slot != null ? hl(slot) : null },
    t ? el("div", { class: "leg" },
      el("span", null, prev && prev.name ? "從" + prev.name + " " : "", MODE_LABEL[t.mode] || "移動", " ", t.minutes != null ? el("strong", null, `${t.minutes} 分`) : null,
        t.status === "verified" ? "" : "左右"),
      t.desc ? el("span", null, t.desc) : null,
      prevQuery && it.query ? el("a", { href: route(prevQuery, it.query, t.mode), target: "_blank", rel: "noopener" }, "看路線") : null) : null,
    it.parking ? el("div", { class: "park" }, el("span", { class: "p" }, "P"),
      el("span", null, it.parking.status === "verified" ? "" : el("span", { class: "unchecked" }, "還沒查"), " ", it.parking.text,
        it.parking.source ? [" ", el("a", { href: it.parking.source, target: "_blank", rel: "noopener" }, "出處")] : null)) : null,
    el("h4", { class: "name" }, it._no ? el("span", { class: "no" }, it._no) : null, it.name, " ", el("span", { class: "what" }, KIND[it.kind] || "")),
    it.pokefuta != null ? lidLine(it) : null,
    it.note ? el("div", { class: "note" }, it.note) : null,
    factList(it.facts),
    it.booking ? el("div", { class: it.fixed ? "booked" : "book" }, (it.fixed ? "已訂好：" : "要先訂：") + it.booking, bookLink(it)) : null,
    it.query && it.kind !== "free" ? el("a", { class: "go", href: maps(it.query), target: "_blank", rel: "noopener" }, "在地圖上看") : null,
    extras(it, day));
}

function iso(x) { return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; }
function lodgingOn(date) { return (TRIP.lodging || []).find(l => (l.nights || []).includes(date) && l.lat != null); }
function dayPoints(day) {
  const prev = parse(day.date); prev.setDate(prev.getDate() - 1);
  const start = lodgingOn(iso(prev)), end = lodgingOn(day.date);
  const pts = [];
  if (start) pts.push({ lat: start.lat, lng: start.lng, label: "宿", name: start.name, q: start.query || start.name, home: true });
  let no = 0;
  for (const it of day.items || []) {
    if (it.lat == null || it.lng == null || it.kind === "free") continue;
    it._no = ++no;
    pts.push({ lat: it.lat, lng: it.lng, label: String(no), name: it.name, q: it.query || it.name });
  }
  if (end) pts.push({ lat: end.lat, lng: end.lng, label: "宿", name: end.name, q: end.query || end.name, home: true });
  return pts;
}
function dayRouteLink(day, pts) {
  if (pts.length < 2) return null;
  const drive = (day.items || []).some(it => it.transit && MODE[it.transit.mode] === "driving");
  const mid = pts.slice(1, -1).slice(0, 9).map(p => p.q).join("|");
  return "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(pts[0].q) +
    "&destination=" + encodeURIComponent(pts[pts.length - 1].q) +
    (mid ? "&waypoints=" + encodeURIComponent(mid) : "") + "&travelmode=" + (drive ? "driving" : "transit");
}
let map = null;
function drawMap(pts) {
  if (map) { map.remove(); map = null; }
  const box = document.getElementById("map");
  if (!box) return;
  if (!window.L || !pts.length) { box.hidden = true; return; }
  map = L.map(box, { scrollWheelZoom: false });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);
  L.polyline(pts.map(p => [p.lat, p.lng]), { color: "#1f2b4d", weight: 2, dashArray: "6 6" }).addTo(map);
  pts.forEach(p => L.marker([p.lat, p.lng], {
    icon: L.divIcon({ className: "", html: `<span class="pin${p.home ? " home" : ""}">${p.label}</span>`, iconSize: [26, 26], iconAnchor: [13, 13] })
  }).bindPopup(el("span", null, p.name)).addTo(map));
  if (pts.length === 1) map.setView([pts[0].lat, pts[0].lng], 14);
  else map.fitBounds(pts.map(p => [p.lat, p.lng]), { padding: [28, 28] });
}

function renderDay(day, n) {
  const pts = dayPoints(day);
  const routeHref = dayRouteLink(day, pts);
  const groups = [];
  for (const it of day.items || []) {
    const last = groups[groups.length - 1];
    if (it.split && last && last.split === it.split) last.items.push(it);
    else groups.push({ split: it.split || null, items: [it] });
  }
  let prev = null;
  const stops = groups.map(g => {
    const first = g.items[0];
    const from = prev;
    const body = g.split ? el("div", { class: "split" }, g.items.map((it, i) => entry(it, from, i, day))) : entry(first, from, null, day);
    const last = g.items[g.items.length - 1];
    prev = { query: last.query || (prev && prev.query), name: last.name };
    return el("div", { class: "stop k-" + (g.split ? "split" : first.kind) },
      el("div", { class: "time" }, first.time ? el("span", { class: "swipe" }, first.time) : "", first.end ? el("small", null, "到 " + first.end) : null),
      el("div", { class: "entries" }, body));
  });
  return [
    el("div", { class: "day-head" },
      el("div", { class: "nth" }, `第 ${n} 天，${md(day.date)} 星期${wd(day.date)}`),
      el("h2", null, day.theme || ""),
      day.rain_plan ? el("div", { class: "rain" }, "下雨的話，" + day.rain_plan) : null),
    pts.length ? el("div", { class: "map-block" },
      el("div", { class: "map", id: "map", role: "img", "aria-label": "這天的動線地圖" }),
      routeHref ? el("a", { class: "map-link", href: routeHref, target: "_blank", rel: "noopener" }, "用 Google 地圖開整天路線") : null) : null,
    optional("早餐，不想吃超商的話", day.breakfast),
    el("div", { class: "route" }, stops),
    optional("吃完還有力氣的話", day.evening),
    optional("肚子餓的話，宵夜", day.late)
  ];
}
function optional(title, list) {
  return list && list.length ? el("section", { class: "alts" },
    el("h3", null, title),
    list.map(a => el("div", { class: "entry" },
      el("h4", { class: "name" }, a.name, " ", el("span", { class: "what" }, KIND[a.kind] || "")),
      a.get ? el("div", { class: "get" }, "必吃：" + a.get) : null,
      a.note ? el("div", { class: "note" }, a.note) : null,
      factList(a.facts),
      a.query ? el("a", { class: "go", href: maps(a.query), target: "_blank", rel: "noopener" }, "在地圖上看") : null))) : null;
}

function renderOverview() {
  const out = [];
  out.push(el("ol", { class: "ov" }, (TRIP.days || []).map((d, i) =>
    el("li", null, el("a", { href: "#day-" + (i + 1) },
      el("span", { class: "d" }, `第 ${i + 1} 天，${md(d.date)} 星期${wd(d.date)}`),
      el("span", { class: "t" }, d.theme || ""),
      el("span", { class: "s" }, (d.items || []).filter(x => x.kind !== "transit" && x.kind !== "free").map(x => x.name).join("、")))))));
  const books = [];
  (TRIP.days || []).forEach(d => (d.items || []).forEach(it => { if (it.booking) books.push([d, it]); }));
  if (books.length) out.push(el("section", { class: "block" }, el("h3", null, "出發前要先訂"),
    el("ul", { class: "list" }, books.map(([d, it]) => el("li", null,
      el("span", { class: "d" }, md(d.date)), el("span", null, el("strong", null, it.name), "，", it.booking, bookLink(it)))))));
  if (TRIP.prep && TRIP.prep.length) out.push(el("section", { class: "block" }, el("h3", null, "出發前要準備"),
    el("ul", { class: "list" }, TRIP.prep.map(p => el("li", null,
      el("span", { class: "d" }, p.label || ""),
      el("span", null, p.text, p.source ? [" ", el("a", { href: p.source, target: "_blank", rel: "noopener" }, "出處")] : null))))));
  if (TRIP.notes && TRIP.notes.length) out.push(el("section", { class: "block" }, el("h3", null, "這趟要知道的"), factList(TRIP.notes)));
  if (TRIP.lodging && TRIP.lodging.length) out.push(el("section", { class: "block" }, el("h3", null, "住哪裡"),
    el("ul", { class: "list" }, TRIP.lodging.map(l => {
      const n = (l.nights || []).length, out = n ? parse(l.nights[n - 1]) : null;
      if (out) out.setDate(out.getDate() + 1);
      return el("li", null,
        el("span", { class: "d" }, `${n} 晚`),
        el("span", null, el("a", { href: maps(l.name + " " + (l.area || "")), target: "_blank", rel: "noopener" }, l.name), l.area ? `，${l.area}` : "",
          n ? el("div", { class: "note" }, `${md(l.nights[0])} 入住，${md(iso(out))} 退房`) : null));
    }))));
  return out;
}

function renderSouvenirs() {
  return [el("section", { class: "block" }, el("h3", null, "伴手禮"),
    (TRIP.souvenirs || []).map(s => el("div", { class: "entry" },
      el("h4", { class: "name" }, s.name),
      s.note ? el("div", { class: "note" }, s.note) : null,
      (s.where || []).length ? el("div", { class: "get" }, "哪裡買：" + s.where.join("、")) : null,
      factList(s.facts))))];
}

function renderAbout() {
  const a = TRIP.about || {};
  return [
    (a.history || []).length ? el("section", { class: "block" }, el("h3", null, "簡單的歷史"), factList(a.history)) : null,
    (a.known_for || []).length ? el("section", { class: "block" }, el("h3", null, "這裡有名的"),
      a.known_for.map(k => el("div", { class: "entry" },
        el("h4", { class: "name" }, k.name),
        k.note ? el("div", { class: "note" }, k.note) : null,
        factList(k.facts)))) : null];
}
function hasAbout() { return !!((TRIP.about || {}).history || []).length || !!((TRIP.about || {}).known_for || []).length; }

function current() {
  if (location.hash === "#about" && hasAbout()) return "a";
  if (location.hash === "#souvenirs" && (TRIP.souvenirs || []).length) return "s";
  const m = /^#day-(\d+)$/.exec(location.hash);
  const n = m ? Number(m[1]) : 0;
  return n >= 1 && n <= (TRIP.days || []).length ? n : 0;
}
function todayIndex() {
  try {
    const t = new Intl.DateTimeFormat("en-CA", { timeZone: TRIP.timezone || undefined }).format(new Date());
    return (TRIP.days || []).findIndex(d => d.date === t) + 1;
  } catch (e) { return 0; }
}
function show() {
  const n = current();
  document.querySelectorAll(".tab").forEach(t => t.removeAttribute("aria-current"));
  const active = document.querySelector(`.tab[data-n="${n}"]`);
  if (active) { active.setAttribute("aria-current", "page"); active.scrollIntoView({ block: "nearest", inline: "center" }); }
  const day = typeof n === "number" && n ? TRIP.days[n - 1] : null;
  document.getElementById("view").replaceChildren(...(n === "s" ? renderSouvenirs() : n === "a" ? renderAbout() : day ? renderDay(day, n) : renderOverview()).filter(k => k != null));
  drawMap(day ? dayPoints(day) : []);
  window.scrollTo(0, 0);
}

function boot() {
  if (!TRIP) { document.getElementById("view").textContent = "這份行程沒有資料，重新產生一次頁面。"; return; }
  const days = (TRIP.days || []).length;
  document.getElementById("head").replaceChildren(el("div", { style: "display:contents" },
    el("h1", null, TRIP.title || ""),
    el("div", { class: "when" }, `${md(TRIP.start)} 星期${wd(TRIP.start)} 到 ${md(TRIP.end)} 星期${wd(TRIP.end)}，共 ${days} 天`),
    TRIP.status === "skeleton" ? el("div", { class: "pencil-note" }, "還在排，營業時間跟交通都還沒查。") : null));
  const tabs = document.getElementById("tabs");
  tabs.append(el("a", { class: "tab", href: "#overview", "data-n": "0" }, "總覽"));
  (TRIP.days || []).forEach((d, i) => tabs.append(
    el("a", { class: "tab", href: "#day-" + (i + 1), "data-n": String(i + 1) }, md(d.date), el("small", null, wd(d.date)))));
  if (hasAbout()) tabs.append(el("a", { class: "tab", href: "#about", "data-n": "a" }, "認識" + (TRIP.destination || "這裡")));
  if ((TRIP.souvenirs || []).length) tabs.append(el("a", { class: "tab", href: "#souvenirs", "data-n": "s" }, "伴手禮"));
  if (TRIP.pokefuta && (TRIP.pokefuta.lids || []).length) tabs.append(el("a", { class: "tab", href: "pokefuta/" }, "Pokémon GO"));
  document.getElementById("foot").textContent = TRIP.checked_at ? `營業時間是 ${TRIP.checked_at} 查的，出發前一週再看一次。` : "";
  if (!location.hash) { const t = todayIndex(); if (t) history.replaceState(null, "", "#day-" + t); }
  window.addEventListener("hashchange", show);
  show();
}
boot();
</script>
</body>
