<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Same grid-paper booklet as the itinerary page beside it. Light only: read outdoors. */
:root {
  --paper: #fbfcfd;
  --grid: #e3eaf0;
  --ink: #1f2b4d;
  --pencil: #6b7590;
  --rule: #c9d3dd;
  --route: rgba(255, 210, 0, .55);
  --main: rgba(96, 214, 96, .45);
  --done: #9aa3b5;
  --hand: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", "BiauKai", serif;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink);
  font: 16px/1.65 var(--sans);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
a { color: inherit; text-decoration-color: var(--pencil); text-underline-offset: 3px; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { padding-block: 32px 12px; display: grid; gap: 6px; }
h1 { margin: 0; font: 700 clamp(28px, 7.5vw, 40px)/1.2 var(--hand); }
.back { font-size: 14px; color: var(--pencil); }
.sub { color: var(--pencil); font-size: 15px; margin: 0; }
.count { font: 700 20px var(--hand); }
.count b { background: var(--route); border-radius: 2px 6px 3px 5px; padding: 0 4px; }
#map { height: 56vh; min-height: 320px; border: 1.5px solid var(--ink); border-radius: 6px; margin-block: 8px 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--pencil); margin-bottom: 8px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--ink); margin-right: 5px; vertical-align: -1px; }
h2 { font: 700 22px/1.3 var(--hand); margin: 28px 0 4px; }
h2 + p { margin: 0 0 8px; color: var(--pencil); font-size: 14px; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; padding: 12px 0; border-bottom: 1px dashed var(--rule); }
li input { width: 22px; height: 22px; margin: 3px 0 0; accent-color: var(--ink); grid-row: span 3; }
.name { font: 700 18px/1.35 var(--hand); }
.when { background: var(--route); border-radius: 2px 6px 3px 5px; padding: 0 4px; font: 700 15px var(--sans); margin-right: 6px; }
.mons { font-size: 15px; }
.meta { font-size: 13px; color: var(--pencil); display: flex; flex-wrap: wrap; gap: 4px 12px; }
li.got .name, li.got .mons { color: var(--done); text-decoration: line-through; }
.pin { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font: 700 12px var(--sans); color: var(--ink); background: #fff; }
.pin.route { background: #ffe066; } .pin.main { background: #a9e9a9; }
.pin.got { background: #e4e7ee; color: var(--done); border-color: var(--done); }
footer { padding-block: 28px 40px; font-size: 13px; color: var(--pencil); }
</style>
</head>

<div class="wrap">

  <div id="map"></div>
  <div class="legend"><span><i style="background:#ffe066"></i>排進行程</span><span><i style="background:#a9e9a9"></i>這趟沒排</span></div>
  <section id="lists"></section>
  <footer id="foot"></footer>
</div>
<script>
const TRIP = {"fetched_at": "2026-11-17", "lids": [{"id": 174, "prefecture": "okinawa", "muni": "那覇市", "pokemon": ["ウインディ"], "addr": "沖縄県那覇市牧志3丁目2", "lat": 26.21641, "lng": 127.68942, "source": "https://local.pokemon.jp/manhole/desc/174/", "place": "てんぶす広場（國際通）", "when": "11/28 12:30"}, {"id": 175, "prefecture": "okinawa", "muni": "宜野湾市", "pokemon": ["サニーゴ", "ラブカス"], "addr": "沖縄県宜野湾市真志喜4-2-1", "lat": 26.28139, "lng": 127.732215, "source": "https://local.pokemon.jp/manhole/desc/175/", "place": "宜野湾トロピカルビーチ", "when": "11/26 16:55"}, {"id": 176, "prefecture": "okinawa", "muni": "沖縄市", "pokemon": ["バチンキー", "ラランテス"], "addr": "沖縄県沖縄市胡屋5-7-1", "lat": 26.32766, "lng": 127.803001, "source": "https://local.pokemon.jp/manhole/desc/176/", "place": "沖縄こどもの国", "when": "11/26 13:15"}, {"id": 177, "prefecture": "okinawa", "muni": "うるま市", "pokemon": ["ケンタロス"], "addr": "沖縄県うるま市石川2316", "lat": 26.436181, "lng": 127.826113, "source": "https://local.pokemon.jp/manhole/desc/177/", "place": "石川多目的ドーム", "when": null}, {"id": 229, "prefecture": "okinawa", "muni": "浦添市", "pokemon": ["ソルロック", "ポポッコ"], "addr": "沖縄県浦添市勢理客4-14-1", "lat": 26.245559, "lng": 127.687899, "source": "https://local.pokemon.jp/manhole/desc/229/", "place": "組踊公園", "when": "11/26 16:30"}, {"id": 230, "prefecture": "okinawa", "muni": "名護市", "pokemon": ["エモンガ", "ツツケラ"], "addr": "沖縄県名護市城二丁目321番3", "lat": 26.587352, "lng": 127.985744, "source": "https://local.pokemon.jp/manhole/desc/230/", "place": "ガジュマル緑地公園", "when": "11/27 17:30"}, {"id": 231, "prefecture": "okinawa", "muni": "糸満市", "pokemon": ["カメール", "スナバァ"], "addr": "沖縄県糸満市西崎町4丁目19-1", "lat": 26.13828, "lng": 127.661336, "source": "https://local.pokemon.jp/manhole/desc/231/", "place": "道の駅いとまん", "when": null}, {"id": 232, "prefecture": "okinawa", "muni": "本部町", "pokemon": ["ホエルオー"], "addr": "沖縄県本部町字石川　海洋博公園地内", "lat": 26.691694, "lng": 127.877972, "source": "https://local.pokemon.jp/manhole/desc/232/", "place": "海洋博公園", "when": "11/27 16:50"}, {"id": 233, "prefecture": "okinawa", "muni": "豊見城市", "pokemon": ["キバゴ", "ジャラコ"], "addr": "沖縄県豊見城市字豊崎1-1162", "lat": 26.15755646, "lng": 127.656121, "source": "https://local.pokemon.jp/manhole/desc/233/", "place": "道の駅豊崎", "when": "11/25 16:40"}, {"id": 234, "prefecture": "okinawa", "muni": "南城市", "pokemon": ["ハブネーク", "ザングース"], "addr": "沖縄県南城市知念久手堅541", "lat": 26.169111, "lng": 127.827083, "source": "https://local.pokemon.jp/manhole/desc/234/", "place": "南城市物産館", "when": "11/25 15:45"}, {"id": 235, "prefecture": "okinawa", "muni": "石垣市", "pokemon": ["マンタイン", "テッポウオ"], "addr": "沖縄県石垣市美崎町1", "lat": 24.337418, "lng": 124.156947, "source": "https://local.pokemon.jp/manhole/desc/235/", "when": null}, {"id": 236, "prefecture": "okinawa", "muni": "宮古島市", "pokemon": ["カイオーガ"], "addr": "沖縄県宮古島市下地与那覇1199-1", "lat": 24.734962, "lng": 125.263088, "source": "https://local.pokemon.jp/manhole/desc/236/", "when": null}, {"id": 422, "prefecture": "okinawa", "muni": "北谷町", "pokemon": ["ガーディ"], "addr": "沖縄県北谷町美浜20番", "lat": 26.315733, "lng": 127.753613, "source": "https://local.pokemon.jp/manhole/desc/422/", "place": "美國村", "when": "11/26 17:20"}, {"id": 423, "prefecture": "okinawa", "muni": "渡嘉敷村", "pokemon": ["ガーディ", "ルリリ", "ヤトウモリ"], "addr": "沖縄県渡嘉敷村阿波連1393－1", "lat": 26.14914, "lng": 127.34735, "source": "https://local.pokemon.jp/manhole/desc/423/", "when": null}, {"id": 424, "prefecture": "okinawa", "muni": "座間味村", "pokemon": ["ガーディ", "ホエルコ"], "addr": "沖縄県座間味村座間味165番地", "lat": 26.227878, "lng": 127.301424, "source": "https://local.pokemon.jp/manhole/desc/424/", "when": null}, {"id": 425, "prefecture": "okinawa", "muni": "久米島町", "pokemon": ["ガーディ", "ウデッポウ"], "addr": "沖縄県久米島町阿嘉530-41", "lat": 26.373985, "lng": 126.788928, "source": "https://local.pokemon.jp/manhole/desc/425/", "when": null}, {"id": 446, "prefecture": "okinawa", "muni": "那覇市", "pokemon": ["ガーディ"], "addr": "沖縄県那覇市首里池端町18", "lat": 26.22005, "lng": 127.71657, "source": "https://local.pokemon.jp/manhole/desc/446/", "place": "首里池端町", "when": "11/28 15:00"}, {"id": 487, "prefecture": "okinawa", "muni": "国頭村", "pokemon": ["ガーディ", "ルナアーラ"], "addr": "沖縄県国頭村辺戸９３７", "lat": 26.87221, "lng": 128.264718, "source": "https://local.pokemon.jp/manhole/desc/487/", "when": null}, {"id": 488, "prefecture": "okinawa", "muni": "大宜味村", "pokemon": ["ガーディ", "ヤヤコマ"], "addr": "沖縄県大宜味村津波95番地", "lat": 26.661031, "lng": 128.101938, "source": "https://local.pokemon.jp/manhole/desc/488/", "when": null}, {"id": 489, "prefecture": "okinawa", "muni": "東村", "pokemon": ["ガーディ", "ニョロトノ", "グレッグル"], "addr": "沖縄県東村平良550-23", "lat": 26.631012, "lng": 128.153484, "source": "https://local.pokemon.jp/manhole/desc/489/", "when": null}, {"id": 490, "prefecture": "okinawa", "muni": "北大東村", "pokemon": ["ガーディ", "ソルガレオ"], "addr": "沖縄県北大東村南", "lat": 25.944616, "lng": 131.327837, "source": "https://local.pokemon.jp/manhole/desc/490/", "when": null}], "title": "沖繩六天五夜"};
const LIDS = TRIP.lids;
// Rendered from trip.json by the travel plugin; `when` is filled from the stop that carries the lid's id.
for (const l of LIDS) l.group = l.when ? "route" : "main";
const GROUPS = [
  ["route", "排進行程的", "照時間排，跟行程頁上的時間一樣"],
  ["main", "這趟沒排", "離行程比較遠，想繞過去再看地圖"]
];
document.getElementById("title").textContent = `${TRIP.title}・Pokémon GO`;
document.getElementById("total").textContent = LIDS.length;
document.getElementById("sub").textContent = `${LIDS.length} 個 Poké Lid。黃色的已經排進行程，勾起來會記在這支手機上。`;
document.getElementById("foot").textContent = `位置和座標來自寶可夢官方「ポケふた」頁面，${TRIP.fetched_at} 抓的。實際設置點以現場為準。`;
const KEY = "pokefuta-got:" + location.pathname;
let got = new Set();
try { got = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...got])); } catch (e) {} };

const sortKey = l => l.when ? l.when.replace(/(\d+)\/(\d+) /, (_, m, d) => m.padStart(2, "0") + d.padStart(2, "0") + " ") : l.muni;
const lists = document.getElementById("lists");
const items = {}, pins = {};
for (const [g, title, note] of GROUPS) {
  const rows = LIDS.filter(l => l.group === g).sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
  const sec = document.createElement("section");
  sec.innerHTML = `<h2>${title}（${rows.length}）</h2><p>${note}</p><ul></ul>`;
  const ul = sec.querySelector("ul");
  for (const l of rows) {
    const li = document.createElement("li");
    li.innerHTML = `<input type="checkbox" aria-label="${l.muni} 拿到了">
      <div class="name">${l.when ? `<span class="when">${l.when}</span>` : ""}${l.muni}${l.place ? "・" + l.place : ""}</div>
      <div class="mons">${l.pokemon.join("、")}</div>
      <div class="meta"><span>${l.addr}</span><a href="https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}" target="_blank" rel="noopener">Google 地圖</a><a href="${l.source}" target="_blank" rel="noopener">官方頁</a></div>`;
    const cb = li.querySelector("input");
    cb.checked = got.has(l.id);
    cb.addEventListener("change", () => { cb.checked ? got.add(l.id) : got.delete(l.id); save(); paint(); });
    li.querySelector(".name").addEventListener("click", () => { map.setView([l.lat, l.lng], 15); pins[l.id].openPopup(); window.scrollTo({ top: 0, behavior: "smooth" }); });
    li.querySelector(".name").style.cursor = "pointer";
    items[l.id] = li; ul.appendChild(li);
  }
  lists.appendChild(sec);
}

const map = L.map("map", { scrollWheelZoom: false });
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "&copy; OpenStreetMap" }).addTo(map);
for (const l of LIDS) {
  pins[l.id] = L.marker([l.lat, l.lng], { icon: L.divIcon({ className: "", html: "", iconSize: [26, 26] }) })
    .bindPopup(`<b>${l.when ? l.when + "　" : ""}${l.muni}${l.place ? "・" + l.place : ""}</b><br>${l.pokemon.join("、")}<br><a href="https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}" target="_blank" rel="noopener">Google 地圖</a>`)
    .addTo(map);
}
const near = LIDS.filter(l => l.group === "route");
map.fitBounds((near.length ? near : LIDS).map(l => [l.lat, l.lng]), { padding: [30, 30] });

function paint() {
  document.getElementById("got").textContent = got.size;
  for (const l of LIDS) {
    const done = got.has(l.id);
    items[l.id].classList.toggle("got", done);
    const label = l.when ? l.when.split(" ")[0].split("/")[1] : "";
    pins[l.id].setIcon(L.divIcon({ className: "", iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -12],
      html: `<div class="pin ${done ? "got" : l.group}">${done ? "✓" : label}</div>` }));
  }
}
paint();
</script>
</body>
</html>
